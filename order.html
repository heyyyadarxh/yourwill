<!DOCTYPE html>
<html>
<head>
    <title>Order</title>

    <!-- MODEL VIEWER (IMPORTANT) -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav>
    <a href="index.html">Home</a>
    <a href="order.html">Order</a>
    <a href="demand.html">Demand</a>
    <a href="contact.html">Contact</a>
    <a href="about.html">About</a>
</nav>

<!-- MAIN -->
<div class="order-container">
    <h2>Design Your Bottle</h2>

    <!-- PREVIEW -->
    <h3>Live Bottle Preview</h3>

    <div class="preview-container">

        <!-- 3D BOTTLE -->
        <model-viewer 
            src="models/bottle.glb"
            auto-rotate
            camera-controls
            disable-zoom
            class="preview-bottle-3d">
        </model-viewer>

        <!-- LABEL -->
        <div class="label">
            <p id="previewText">YOUR TEXT</p>
        </div>

    </div>

    <!-- TEMPLATE SECTION -->
    <h3>Select a Design Template</h3>

    <div class="templates">

        <div class="template-card" onclick="selectTemplate(this, 'Sparkling Water')">
            <img src="images/img1.jpeg">
        </div>

        <div class="template-card" onclick="selectTemplate(this, 'Classy ')">
            <img src="images/img2.jpeg">
        </div>

        <div class="template-card" onclick="selectTemplate(this, 'Coco Loco')">
            <img src="images/img3.jpeg">
        </div>

        <div class="template-card" onclick="selectTemplate(this, 'Cheers to Love')">
            <img src="images/img4.jpeg">
        </div>

        <div class="template-card" onclick="selectTemplate(this, 'Happy Birthday')">
            <img src="images/img5.jpeg">
        </div>

        <div class="template-card" onclick="selectTemplate(this, 'Birthday Party')">
            <img src="images/img6.jpeg">
        </div>

    </div>

    <!-- FORM -->
    <form onsubmit="alert('Order Submitted!'); return false;">
        
        <input type="text" placeholder="Enter Name / Message" oninput="updatePreview(this.value)">

        <select>
            <option>Select Occasion</option>
            <option>Birthday</option>
            <option>College Event</option>
            <option>Bhandara</option>
        </select>

        <input type="color">

        <input type="number" placeholder="Quantity">

        <textarea placeholder="Extra customization (optional)"></textarea>

        <button>Place Order</button>
    </form>

</div>

<!-- JS -->
<script>
function updatePreview(text) {
    document.getElementById("previewText").innerText = text;
}

function selectTemplate(element, text) {
    let all = document.querySelectorAll('.template-card');
    all.forEach(e => e.classList.remove('selected'));

    element.classList.add('selected');

    document.getElementById("previewText").innerText = text;
}
</script>

</body>
</html>
